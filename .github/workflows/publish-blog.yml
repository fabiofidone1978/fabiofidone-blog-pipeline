name: Pubblica articolo blog fabiofidone.it

on:
  schedule:
    # Lunedi' e giovedi' alle 6:00 UTC (~8:00 ora italiana estiva, 7:00
    # ora solare — cron GitHub Actions e' sempre UTC fisso, non segue il
    # cambio ora legale: l'orario locale si sposta di un'ora tra le due
    # stagioni, stesso limite gia' presente nella versione precedente)
    - cron: "0 6 * * 1,4"
  workflow_dispatch: {}   # bottone "Run workflow" per lanciare un test manuale

permissions:
  contents: write   # senza questo il GITHUB_TOKEN di default e' sola-lettura e il push del commit automatico fallisce con 403

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Genera articolo e aggiorna il sito
        id: generate
        working-directory: pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
        run: python generate_article.py

      - name: Commit modifiche nel repository
        run: |
          git config user.name "fabiofidone-blog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/ pipeline/topics_covered.json
          git diff --staged --quiet || git commit -m "Nuovo articolo blog automatico [skip ci]"
          git push

      - name: Pubblica su Aruba via FTP (blog/ + sitemap.xml)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./site/
          server-dir: ./fabiofidone.it/
          dangerous-clean-slate: false

      # Avvisa Bing/IndexNow del nuovo URL — a differenza della Indexing API
      # di Google (riservata a JobPosting/BroadcastEvent, non usabile per
      # articoli di blog), IndexNow non ha restrizioni di contenuto ed e'
      # pensata esattamente per questo caso. Non garantisce l'indicizzazione,
      # solo la notifica tempestiva del nuovo contenuto.
      - name: Notifica IndexNow (Bing e altri motori aderenti)
        if: success() && steps.generate.outputs.slug != ''
        run: |
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "www.fabiofidone.it",
              "key": "dad7be1630d17b70bb076a139effe4cb",
              "keyLocation": "https://www.fabiofidone.it/dad7be1630d17b70bb076a139effe4cb.txt",
              "urlList": ["https://www.fabiofidone.it/blog/${{ steps.generate.outputs.slug }}/", "https://www.fabiofidone.it/blog/"]
            }'

      # Notifica finale — parte SOLO se generazione + commit + upload FTP sono
      # andati tutti a buon fine. Deliberatamente fuori dallo script Python:
      # quello scrive solo file in locale nel runner, non sa se poi git push
      # o l'upload FTP falliscono dopo di lui.
      - name: Notifica successo su WhatsApp
        if: success() && steps.generate.outputs.slug != ''
        run: |
          curl -s -G "https://api.callmebot.com/whatsapp.php" \
            --data-urlencode "phone=${{ secrets.WHATSAPP_PHONE }}" \
            --data-urlencode "text=Nuovo articolo blog PUBBLICATO: \"${{ steps.generate.outputs.titolo }}\" — https://www.fabiofidone.it/blog/${{ steps.generate.outputs.slug }}/" \
            --data-urlencode "apikey=${{ secrets.WHATSAPP_APIKEY }}"

      # Annuncio su LinkedIn — SOLO dopo che l'articolo e' davvero online
      # (stesso motivo della notifica WhatsApp sopra). continue-on-error:
      # true e' voluto: se il token LinkedIn e' scaduto (dura ~60gg, limite
      # di LinkedIn) questo step fallisce ma non deve marcare l'intero job
      # come fallito, altrimenti scatterebbe anche la notifica di fallimento
      # "commit o upload FTP" qui sotto, che sarebbe fuorviante — il blog e'
      # stato pubblicato correttamente, e' solo LinkedIn che non ha funzionato.
      - name: Genera e pubblica post LinkedIn
        id: linkedin
        if: success() && steps.generate.outputs.slug != ''
        continue-on-error: true
        working-directory: pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          ARTICLE_TITOLO: ${{ steps.generate.outputs.titolo }}
          ARTICLE_SLUG: ${{ steps.generate.outputs.slug }}
          ARTICLE_LEDE: ${{ steps.generate.outputs.lede }}
          ARTICLE_META_DESCRIPTION: ${{ steps.generate.outputs.meta_description }}
        run: python generate_linkedin_post.py

      - name: Notifica fallimento pubblicazione LinkedIn
        if: steps.linkedin.outcome == 'failure'
        run: |
          curl -s -G "https://api.callmebot.com/whatsapp.php" \
            --data-urlencode "phone=${{ secrets.WHATSAPP_PHONE }}" \
            --data-urlencode "text=Blog fabiofidone.it: articolo pubblicato ma post LinkedIn FALLITO (probabile token scaduto, dura ~60gg) — controlla i log su GitHub Actions e rigenera LINKEDIN_TOKEN" \
            --data-urlencode "apikey=${{ secrets.WHATSAPP_APIKEY }}"

      - name: Notifica fallimento su WhatsApp (commit o upload FTP)
        if: failure()
        run: |
          curl -s -G "https://api.callmebot.com/whatsapp.php" \
            --data-urlencode "phone=${{ secrets.WHATSAPP_PHONE }}" \
            --data-urlencode "text=Blog fabiofidone.it: il run e' fallito nel commit o nell'upload FTP (non nella generazione) — controlla i log su GitHub Actions" \
            --data-urlencode "apikey=${{ secrets.WHATSAPP_APIKEY }}"
